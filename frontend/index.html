<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodShift - Explore Your Emotions</title>
   <link rel="stylesheet" href="styles/styles/style.css">


</head>
<body>
  <div class="mood-container">
    <!-- Title -->
    <div class="title-wrapper">
      <h1 class="main-title">CSS MOODSHIFT</h1>
      <p class="subtitle">Explore your emotional landscape</p>
    </div>

    <!-- Central Animated Blob -->
    <div class="blob-wrapper">
      <div class="blob"></div>
    </div>

    <!-- Four Mood Zones -->
    <div class="zones-grid">
      <!-- Calm Zone -->
      <div class="mood-zone calm-zone" data-mood="calm">
        <div class="zone-content">
          <span class="zone-label">Calm</span>
          <span class="zone-icon">☮️</span>
        </div>
      </div>

      <!-- Energetic Zone -->
      <div class="mood-zone energetic-zone" data-mood="energetic">
        <div class="zone-content">
          <span class="zone-label">Energetic</span>
          <span class="zone-icon">⚡</span>
        </div>
      </div>

      <!-- Mystery Zone -->
      <div class="mood-zone mystery-zone" data-mood="mystery">
        <div class="zone-content">
          <span class="zone-label">Mystery</span>
          <span class="zone-icon">🌙</span>
        </div>
      </div>

      <!-- Happy Zone -->
      <div class="mood-zone happy-zone" data-mood="happy">
        <div class="zone-content">
          <span class="zone-label">Happy</span>
          <span class="zone-icon">✨</span>
        </div>
      </div>
    </div>

    <!-- Navigation Link -->
    <div class="nav-link">
      <a href="dashboard.html" class="dashboard-btn">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
